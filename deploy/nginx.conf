# nginx.conf — Reverse proxy del único punto de entrada público.
# Reemplaza al Caddyfile original porque Caddy con cert autofirmado + Alpine
# estaba dando TLS alert internal error en el handshake. nginx es roca:
# la config es explícita, sin auto-magia, y el cert se genera con openssl
# al build de la imagen (no en runtime).
#
# Tres trabajos del proxy:
#   1) /api/*    → backend api:3000
#   2) /collab/* → servidor Yjs/WebSocket collab-server:1234
#   3) resto     → frontend estático (SPA React servido desde /usr/share/nginx/html)
#                  con fallback a index.html para que el router del SPA resuelva
#
# TLS: cert autofirmado en /etc/nginx/certs/. Let's Encrypt veta emitir para
# *.compute.amazonaws.com por policy global; el cert auto-firmado cumple el
# requisito de HTTPS (getUserMedia / wss funcionan) pero el navegador tira
# warning la primera vez — el usuario lo acepta y entra.

# Redirige HTTP → HTTPS (importante para que el puerto 80 no quede muerto
# y para que el primer GET sin TLS no rebote con "connection refused").
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS principal.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Bloquea versiones viejas de TLS (TLS 1.0 y 1.1 son inseguras y los
    # navegadores modernos ya las rechazan).
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tamaño máximo del body (10 MB) — para que los uploads de imágenes
    # de diagramas (photo-import) entren sin error 413.
    client_max_body_size 10M;

    # Logs accesibles vía docker compose logs.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # /api/* → backend FastAPI en el puerto 3000.
    # proxy_set_header: pasa el Host y la IP real del cliente (no la de docker).
    location /api/ {
        proxy_pass         http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /collab/* → servidor Yjs/WebSocket.
    # Las 3 líneas de Upgrade son obligatorias para que nginx haga el
    # handshake WebSocket correctamente (sin esto, wss:// falla).
    location /collab/ {
        proxy_pass         http://collab-server:1234/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSockets son conexiones largas; sin timeout_read desactiva el
        # corte por inactividad a 60s (default).
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # Resto → frontend estático (SPA React).
    # try_files: si el archivo existe servilo, si no, devolvé index.html
    # para que el router del SPA resuelva (sin esto, F5 en /mi-diagrama da 404).
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
