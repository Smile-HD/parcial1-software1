# openspec/config.yaml
schema: spec-driven

context: |
  Project: parcial1 (university exam project) — ai-uml-design-tool
  Stack: pnpm monorepo, Node >=22, TypeScript strict, ESM, Yjs, Zod, Fastify, React 19, Vite 6
  Workspaces: apps/{api,web,collab-server}, packages/{core,adapters-ai,adapters-import,codegen}
  Testing: vitest 3 in every workspace, RTL+jsdom in web, golden build check via tools/golden-check.mjs (Maven+Spring)
  Status: mid-implementation — openspec/changes/ai-uml-design-tool is the active change with 10 specs
  Session: interactive, artifact_store=both, delivery=ask-on-risk, review_budget=400 lines

strict_tdd: true

testing:
  runner: vitest
  unit: true
  integration: true
  e2e: false
  coverage: false
  framework: vitest@^3.0.0
  unit_tool: vitest
  integration_tool: "vitest + @testing-library/react + jsdom (web); vitest + node:test-like helpers (api/collab-server/adapters)"
  e2e_tool: "tools/golden-check.mjs — full Maven build + Spring boot + HTTP CRUD round-trip"
  coverage_tool: none
  type_check: tsc --noEmit (tsconfig.base.json strict + noUncheckedIndexedAccess + exactOptionalPropertyTypes)
  linter: none
  formatter: none
  test_command: pnpm -r test
  note: "Strict TDD activated by user request: write the failing test first, see it fail for the right reason, then implement, then refactor. No production code without a test."

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Include sequence diagrams for complex flows
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Strict TDD: tests come first, then the minimum code to pass
      - Never disable, skip, or .only() tests to make them green
    tdd: true
    test_command: pnpm -r test
  verify:
    test_command: pnpm -r test
    build_command: tsc --noEmit -p tsconfig.base.json
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
